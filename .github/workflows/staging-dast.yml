name: AVERON Staging DAST and API Fuzzing

on:
  workflow_dispatch:
    inputs:
      service:
        description: Staging service to test
        required: true
        type: choice
        options:
          - backend
          - frontend
          - admin
          - parser
      scan_mode:
        description: Passive ZAP baseline or active staging scan
        required: true
        type: choice
        options:
          - passive
          - active
      run_api_fuzzing:
        description: Run Schemathesis (backend OpenAPI endpoint required)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  staging-scan:
    runs-on: ubuntu-latest
    environment: security-staging
    env:
      SECURITY_ENV: staging
      SECURITY_SERVICE: ${{ inputs.service }}
      SECURITY_TARGET_URL: ${{ vars.SECURITY_STAGING_TARGET_URL }}
      SECURITY_STAGING_ALLOWED_ORIGINS: ${{ vars.SECURITY_STAGING_ALLOWED_ORIGINS }}
      SECURITY_DAST_MODE: ${{ inputs.scan_mode }}
      ALLOW_AGGRESSIVE_SECURITY_TESTS: "true"
      SECURITY_OPENAPI_URL: ${{ vars.SECURITY_STAGING_OPENAPI_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate staging target before any scanner starts
        env:
          SECURITY_DAST_PRECHECK_ONLY: "true"
        run: |
          mkdir -p reports/generated
          node -e "import('./scripts/safety.mjs').then(async m => { await m.requireAggressivePermission(); await m.validateTarget(m.requireTarget()); })"
      - name: Validate Schemathesis service selection
        if: ${{ inputs.run_api_fuzzing && inputs.service != 'backend' }}
        run: |
          echo "Schemathesis requires the backend service selection." >&2
          exit 1
      - name: Run OWASP ZAP passive baseline
        if: ${{ inputs.scan_mode == 'passive' }}
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ vars.SECURITY_STAGING_TARGET_URL }}
          cmd_options: "-m 2 -I"
      - name: Run OWASP ZAP active scan
        if: ${{ inputs.scan_mode == 'active' }}
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: ${{ vars.SECURITY_STAGING_TARGET_URL }}
          allow_issue_writing: false
      - name: Run Schemathesis against staging API
        if: ${{ inputs.run_api_fuzzing && inputs.service == 'backend' }}
        run: |
          python -m pip install --disable-pip-version-check schemathesis==4.32.0
          set -o pipefail
          npm run security:api 2>&1 | tee reports/generated/schemathesis.log
      - name: Upload staging scan output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: averon-staging-security-scan
          path: reports/generated/
          if-no-files-found: warn
