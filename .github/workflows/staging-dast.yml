name: AVERON Staging DAST and API Fuzzing

on:
  workflow_dispatch:
    inputs:
      service:
        description: Staging service to test
        required: true
        type: choice
        options:
          - backend
          - frontend
          - admin
          - parser
      scan_mode:
        description: Passive ZAP baseline or active staging scan
        required: true
        type: choice
        options:
          - passive
          - active
      confirm_staging_active_tests:
        description: Explicitly authorize active ZAP scanning and/or Schemathesis fuzzing against the allowlisted staging target
        required: true
        type: boolean
        default: false
      run_api_fuzzing:
        description: Run Schemathesis (backend OpenAPI endpoint required)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  staging-scan:
    runs-on: ubuntu-latest
    environment: security-staging
    env:
      SECURITY_ENV: staging
      SECURITY_SERVICE: ${{ inputs.service }}
      SECURITY_TARGET_URL: ${{ vars.SECURITY_STAGING_TARGET_URL }}
      SECURITY_STAGING_ALLOWED_ORIGINS: ${{ vars.SECURITY_STAGING_ALLOWED_ORIGINS }}
      SECURITY_DAST_MODE: ${{ inputs.scan_mode }}
      ALLOW_AGGRESSIVE_SECURITY_TESTS: ${{ inputs.confirm_staging_active_tests }}
      SECURITY_OPENAPI_URL: ${{ vars.SECURITY_STAGING_OPENAPI_URL }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node v6.5.0
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python v6
        if: ${{ inputs.run_api_fuzzing }}
        with:
          python-version: "3.12"
      - name: Validate staging target before any scanner starts
        env:
          SECURITY_DAST_PRECHECK_ONLY: "true"
          REQUIRE_AGGRESSIVE_PERMISSION: ${{ inputs.scan_mode == 'active' || inputs.run_api_fuzzing }}
        run: |
          mkdir -p reports/generated
          node -e "import('./scripts/safety.mjs').then(async m => { if (process.env.REQUIRE_AGGRESSIVE_PERMISSION === 'true') await m.requireAggressivePermission(); await m.validateTarget(m.requireTarget()); })"
      - name: Validate Schemathesis service selection
        if: ${{ inputs.run_api_fuzzing && inputs.service != 'backend' }}
        run: |
          echo "Schemathesis requires the backend service selection." >&2
          exit 1
      - name: Run OWASP ZAP passive baseline
        if: ${{ inputs.scan_mode == 'passive' }}
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # zaproxy/action-baseline v0.14.0
        with:
          target: ${{ vars.SECURITY_STAGING_TARGET_URL }}
          cmd_options: "-m 2 -I -J reports/generated/zap-baseline.json -r reports/generated/zap-baseline.html"
          allow_issue_writing: false
      - name: Run OWASP ZAP active scan
        if: ${{ inputs.scan_mode == 'active' }}
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # zaproxy/action-full-scan v0.13.0
        with:
          target: ${{ vars.SECURITY_STAGING_TARGET_URL }}
          allow_issue_writing: false
          cmd_options: "-I -J reports/generated/zap-active.json -r reports/generated/zap-active.html"
      - name: Run Schemathesis against staging API
        if: ${{ inputs.run_api_fuzzing && inputs.service == 'backend' }}
        run: |
          python -m pip install --disable-pip-version-check schemathesis==4.32.0
          set -o pipefail
          npm run security:api 2>&1 | tee reports/generated/schemathesis.log
      - name: Upload staging scan output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v6.0.0 (Node.js 24)
        with:
          name: averon-staging-security-scan
          path: reports/generated/
          if-no-files-found: warn
