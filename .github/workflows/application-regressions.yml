name: AVERON Application Regressions

on:
  pull_request:
  push:
    branches: [main]
  repository_dispatch:
    types: [averon-application-changed]
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Exact backend commit SHA or main
        type: string
        required: true
        default: main
      frontend_ref:
        description: Exact frontend commit SHA or main
        type: string
        required: true
        default: main
      admin_ref:
        description: Exact admin commit SHA or main
        type: string
        required: true
        default: main
      parser_ref:
        description: Exact parser commit SHA or main
        type: string
        required: true
        default: main

permissions:
  contents: read

jobs:
  repository-read-preflight:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require private source repository read access
        shell: bash
        env:
          AVERON_REPOS_READ_TOKEN: ${{ secrets.AVERON_REPOS_READ_TOKEN }}
        run: |
          if [[ -z "$AVERON_REPOS_READ_TOKEN" ]]; then
            message="Required cross-repository read credential is not configured. Required verification was NOT performed. Configure the AVERON_REPOS_READ_TOKEN Actions secret."
            echo "::error title=CI configuration incomplete::$message"
            printf '%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Cross-repository source-read and commit-status credential is configured."

  regression-tests:
    runs-on: ubuntu-latest
    needs: repository-read-preflight
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          repository: Saidaminov-x7/AVERON-backend
          ref: ${{ inputs.backend_ref != 'main' && inputs.backend_ref || (github.event.client_payload.repository == 'AVERON-backend' && github.event.client_payload.sha) || 'main' }}
          path: source-checkouts/backend
          token: ${{ secrets.AVERON_REPOS_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          repository: Saidaminov-x7/AVERON-frontend
          ref: ${{ inputs.frontend_ref != 'main' && inputs.frontend_ref || (github.event.client_payload.repository == 'AVERON-frontend' && github.event.client_payload.sha) || 'main' }}
          path: source-checkouts/frontend
          token: ${{ secrets.AVERON_REPOS_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          repository: Saidaminov-x7/AVERON-admin-panel
          ref: ${{ inputs.admin_ref != 'main' && inputs.admin_ref || (github.event.client_payload.repository == 'AVERON-admin-panel' && github.event.client_payload.sha) || 'main' }}
          path: source-checkouts/admin
          token: ${{ secrets.AVERON_REPOS_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          repository: Saidaminov-x7/AVERON-parser
          ref: ${{ inputs.parser_ref != 'main' && inputs.parser_ref || (github.event.client_payload.repository == 'AVERON-parser' && github.event.client_payload.sha) || 'main' }}
          path: source-checkouts/parser
          token: ${{ secrets.AVERON_REPOS_READ_TOKEN }}
          persist-credentials: false
      - name: Validate each checked out SHA
        env:
          TRIGGER_REPOSITORY: ${{ github.event.client_payload.repository }}
          TRIGGER_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          declare -A paths=(
            [AVERON-backend]=backend
            [AVERON-frontend]=frontend
            [AVERON-admin-panel]=admin
            [AVERON-parser]=parser
          )
          for repository in AVERON-backend AVERON-frontend AVERON-admin-panel AVERON-parser; do
            path="${paths[$repository]}"
            if [[ "$repository" == "$TRIGGER_REPOSITORY" && ! "$TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::repository_dispatch needs a full 40 digit SHA"
              exit 1
            fi
            actual="$(git -C "source-checkouts/$path" rev-parse HEAD)"
            if [[ "$repository" == "$TRIGGER_REPOSITORY" && "$actual" != "$TRIGGER_SHA" ]]; then
              echo "::error::$repository actual=$actual expected=$TRIGGER_SHA"
              exit 1
            fi
            echo "$repository current=$actual verified=$actual" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node v6.5.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # pnpm/action-setup v4
        with:
          version: 9.15.9
      - name: Install and test backend
        working-directory: source-checkouts/backend
        run: pnpm install --frozen-lockfile && pnpm prisma:generate && pnpm --filter api test
        env:
          DATABASE_URL: postgresql://unit-test:unit-test@127.0.0.1:1/unit_test
          REDIS_URL: redis://127.0.0.1:1
          JWT_SECRET: unit-test-only-jwt-signing-secret-not-production
          REFRESH_SECRET: unit-test-only-refresh-signing-secret-not-production
      - name: Verify backend
        working-directory: source-checkouts/backend
        run: pnpm --filter api type-check && pnpm --filter api lint && pnpm --filter api build
      - name: Install and verify frontend
        working-directory: source-checkouts/frontend
        run: pnpm install --frozen-lockfile && pnpm test && pnpm exec tsc --noEmit && pnpm lint && pnpm build
      - name: Install and verify admin
        working-directory: source-checkouts/admin
        run: pnpm install --frozen-lockfile && pnpm test && pnpm exec tsc -b --pretty false && pnpm lint && pnpm build
      - name: Install npm parser
        working-directory: source-checkouts/parser
        run: npm ci
      - name: Verify parser
        working-directory: source-checkouts/parser
        run: npm test && npm run lint && npm run typecheck && npm run build
      - name: Run Playwright desktop and mobile smoke tests
        working-directory: .
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          npm run e2e:smoke
        env:
          AVERON_STOREFRONT_URL: ${{ vars.AVERON_STOREFRONT_URL }}
          AVERON_ADMIN_URL: ${{ vars.AVERON_ADMIN_URL }}
      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # actions/upload-artifact v6.0.0 (Node.js 24)
        with:
          name: averon-playwright-smoke
          path: reports/generated/playwright*
          if-no-files-found: warn
      - name: Generate release-verification manifest
        if: always()
        env:
          AVERON_MANIFEST_PATH: ${{ runner.temp }}/averon-release-manifest.json
          AVERON_VERIFICATION_STATUS: ${{ job.status }}
        run: node scripts/generate-verification-manifest.mjs
      - name: Publish SHA manifest and final status
        if: always()
        run: |
          {
            echo '## AVERON CROSS-REPOSITORY VERIFICATION'
            for pair in "AVERON-backend:backend" "AVERON-frontend:frontend" "AVERON-admin-panel:admin" "AVERON-parser:parser"; do
              name="${pair%%:*}"; path="${pair##*:}"
              sha="$(git -C "source-checkouts/$path" rev-parse HEAD 2>/dev/null || echo NOT_CHECKED_OUT)"
              echo "$name: $sha"
            done
            echo "Security tests: $(git rev-parse HEAD)"
            echo "Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified source SHA manifest
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # actions/upload-artifact v6.0.0 (Node.js 24)
        with:
          name: averon-source-sha-manifest
          path: ${{ runner.temp }}/averon-release-manifest.json
          if-no-files-found: warn

  publish-source-commit-status:
    if: ${{ always() && (github.event_name == 'repository_dispatch' && github.event.action == 'averon-application-changed' || github.event_name == 'workflow_dispatch' && inputs.backend_ref != 'main' && inputs.frontend_ref != 'main' && inputs.admin_ref != 'main' && inputs.parser_ref != 'main') }}
    runs-on: ubuntu-latest
    needs: [repository-read-preflight, regression-tests]
    permissions: {}
    steps:
      - name: Publish required status to the exact source commit
        env:
          GH_TOKEN: ${{ secrets.AVERON_REPOS_READ_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REPOSITORY: ${{ github.event.client_payload.repository }}
          SOURCE_SHA: ${{ github.event.client_payload.sha }}
          BACKEND_SHA: ${{ inputs.backend_ref }}
          FRONTEND_SHA: ${{ inputs.frontend_ref }}
          ADMIN_SHA: ${{ inputs.admin_ref }}
          PARSER_SHA: ${{ inputs.parser_ref }}
          PREFLIGHT_RESULT: ${{ needs.repository-read-preflight.result }}
          REGRESSION_RESULT: ${{ needs.regression-tests.result }}
        run: |
          set -euo pipefail
          if [[ "$PREFLIGHT_RESULT" == success && "$REGRESSION_RESULT" == success ]]; then
            state=success
            description="Exact-SHA cross-repository checks passed"
          else
            state=failure
            description="Cross-repository checks incomplete or failed; see linked run"
          fi
          publish_status() {
            repository="$1"; sha="$2"
            case "$repository" in
              AVERON-backend|AVERON-frontend|AVERON-admin-panel|AVERON-parser) ;;
              *) echo "::error::Unsupported source repository: $repository"; exit 1 ;;
            esac
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid SHA for $repository"; exit 1; }
            gh api "repos/Saidaminov-x7/$repository/statuses/$sha" \
              -f state="$state" \
              -f context='AVERON / cross-repository verify' \
              -f description="$description" \
              -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            publish_status AVERON-backend "$BACKEND_SHA"
            publish_status AVERON-frontend "$FRONTEND_SHA"
            publish_status AVERON-admin-panel "$ADMIN_SHA"
            publish_status AVERON-parser "$PARSER_SHA"
          else
            publish_status "$SOURCE_REPOSITORY" "$SOURCE_SHA"
          fi
