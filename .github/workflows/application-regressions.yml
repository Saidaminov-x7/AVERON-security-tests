name: AVERON Application Regressions

on:
  pull_request:
  push:
    branches: [main]
  repository_dispatch:
    types: [averon-application-changed]
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Exact backend commit SHA or main
        type: string
        required: true
        default: main
      frontend_ref:
        description: Exact frontend commit SHA or main
        type: string
        required: true
        default: main
      admin_ref:
        description: Exact admin commit SHA or main
        type: string
        required: true
        default: main
      parser_ref:
        description: Exact parser commit SHA or main
        type: string
        required: true
        default: main

permissions:
  contents: read

jobs:
  repository-read-preflight:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require private source repository read access
        shell: bash
        env:
          AVERON_REPOS_READ_TOKEN: ${{ secrets.AVERON_REPOS_READ_TOKEN }}
        run: |
          if [[ -z "$AVERON_REPOS_READ_TOKEN" ]]; then
            message="Required cross-repository read credential is not configured. Required verification was NOT performed. Configure the AVERON_REPOS_READ_TOKEN Actions secret."
            echo "::error title=CI configuration incomplete::$message"
            printf '%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Cross-repository source-read and commit-status credential is configured."

  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: repository-read-preflight
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          repository: Saidaminov-x7/AVERON-backend
          ref: ${{ inputs.backend_ref != 'main' && inputs.backend_ref || (github.event.client_payload.repository == 'AVERON-backend' && github.event.client_payload.sha) || 'main' }}
          path: source-checkouts/backend
          token: ${{ secrets.AVERON_REPOS_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          repository: Saidaminov-x7/AVERON-frontend
          ref: ${{ inputs.frontend_ref != 'main' && inputs.frontend_ref || (github.event.client_payload.repository == 'AVERON-frontend' && github.event.client_payload.sha) || 'main' }}
          path: source-checkouts/frontend
          token: ${{ secrets.AVERON_REPOS_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          repository: Saidaminov-x7/AVERON-admin-panel
          ref: ${{ inputs.admin_ref != 'main' && inputs.admin_ref || (github.event.client_payload.repository == 'AVERON-admin-panel' && github.event.client_payload.sha) || 'main' }}
          path: source-checkouts/admin
          token: ${{ secrets.AVERON_REPOS_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          repository: Saidaminov-x7/AVERON-parser
          ref: ${{ inputs.parser_ref != 'main' && inputs.parser_ref || (github.event.client_payload.repository == 'AVERON-parser' && github.event.client_payload.sha) || 'main' }}
          path: source-checkouts/parser
          token: ${{ secrets.AVERON_REPOS_READ_TOKEN }}
          persist-credentials: false
      - name: Validate each checked out SHA
        env:
          TRIGGER_REPOSITORY: ${{ github.event.client_payload.repository }}
          TRIGGER_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          declare -A paths=(
            [AVERON-backend]=backend
            [AVERON-frontend]=frontend
            [AVERON-admin-panel]=admin
            [AVERON-parser]=parser
          )
          for repository in AVERON-backend AVERON-frontend AVERON-admin-panel AVERON-parser; do
            path="${paths[$repository]}"
            if [[ "$repository" == "$TRIGGER_REPOSITORY" && ! "$TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::repository_dispatch needs a full 40 digit SHA"
              exit 1
            fi
            actual="$(git -C "source-checkouts/$path" rev-parse HEAD)"
            if [[ "$repository" == "$TRIGGER_REPOSITORY" && "$actual" != "$TRIGGER_SHA" ]]; then
              echo "::error::$repository actual=$actual expected=$TRIGGER_SHA"
              exit 1
            fi
            echo "$repository current=$actual verified=$actual" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node v6.5.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # pnpm/action-setup v4
        with:
          version: 9.15.9
      - name: Install and test backend
        working-directory: source-checkouts/backend
        run: pnpm install --frozen-lockfile && pnpm prisma:generate && pnpm --filter api test
        env:
          DATABASE_URL: postgresql://unit-test:unit-test@127.0.0.1:1/unit_test
          REDIS_URL: redis://127.0.0.1:1
          JWT_SECRET: unit-test-only-jwt-signing-secret-not-production
          REFRESH_SECRET: unit-test-only-refresh-signing-secret-not-production
      - name: Verify backend
        working-directory: source-checkouts/backend
        run: pnpm --filter api type-check && pnpm --filter api lint && pnpm --filter api build
      - name: Install and verify frontend
        working-directory: source-checkouts/frontend
        run: pnpm install --frozen-lockfile && pnpm test && pnpm exec tsc --noEmit && pnpm lint && pnpm build
      - name: Install and verify admin
        working-directory: source-checkouts/admin
        run: pnpm install --frozen-lockfile && pnpm test && pnpm exec tsc -b --pretty false && pnpm lint && pnpm build
      - name: Install npm parser
        working-directory: source-checkouts/parser
        run: npm ci
      - name: Verify parser
        working-directory: source-checkouts/parser
        run: npm test && npm run lint && npm run typecheck && npm run build
      - name: Run Playwright desktop and mobile smoke tests
        working-directory: .
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          node --input-type=module -e "import { writeFile } from 'node:fs/promises'; import { tmpdir } from 'node:os'; import { join } from 'node:path'; const json=Buffer.from(JSON.stringify({asset:{version:'2.0',generator:'AVERON E2E fixture'},scene:0,scenes:[{nodes:[0]}],nodes:[{mesh:0}],meshes:[{primitives:[{attributes:{POSITION:0},indices:1,material:0}]}],materials:[{pbrMetallicRoughness:{baseColorFactor:[0.12,0.28,0.68,1]}}],buffers:[{byteLength:44}],bufferViews:[{buffer:0,byteOffset:0,byteLength:36,target:34962},{buffer:0,byteOffset:36,byteLength:6,target:34963}],accessors:[{bufferView:0,componentType:5126,count:3,type:'VEC3',min:[-0.5,-0.5,0],max:[0.5,0.5,0]},{bufferView:1,componentType:5123,count:3,type:'SCALAR',min:[0],max:[2]}]})); const padded=Buffer.concat([json,Buffer.alloc((4-json.length%4)%4,0x20)]); const bin=Buffer.alloc(44); [-.5,-.5,0,.5,-.5,0,0,.5,0].forEach((v,i)=>bin.writeFloatLE(v,i*4)); [0,1,2].forEach((v,i)=>bin.writeUInt16LE(v,36+i*2)); const len=12+8+padded.length+8+bin.length; const out=Buffer.alloc(len); out.writeUInt32LE(0x46546c67,0); out.writeUInt32LE(2,4); out.writeUInt32LE(len,8); out.writeUInt32LE(padded.length,12); out.writeUInt32LE(0x4e4f534a,16); padded.copy(out,20); const off=20+padded.length; out.writeUInt32LE(bin.length,off); out.writeUInt32LE(0x004e4942,off+4); bin.copy(out,off+8); await writeFile(join(process.env.RUNNER_TEMP || tmpdir(),'averon-e2e-fitting.glb'),out);"
          node scripts/local-admin-fixture.mjs > "$RUNNER_TEMP/averon-admin-fixture.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          cd source-checkouts/admin
          VITE_API_URL=http://127.0.0.1:4200 pnpm dev --host 127.0.0.1 --port 3200 --strictPort > "$RUNNER_TEMP/averon-admin-vite.log" 2>&1 &
          admin_pid=$!
          trap 'kill "$admin_pid" "$fixture_pid" 2>/dev/null || true' EXIT
          fixture_ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4200/__fixture/requests >/dev/null; then fixture_ready=true; break; fi
            if ! kill -0 "$fixture_pid" 2>/dev/null; then cat "$RUNNER_TEMP/averon-admin-fixture.log"; exit 1; fi
            sleep 1
          done
          [[ "$fixture_ready" == true ]] || { echo "Admin fixture did not start"; cat "$RUNNER_TEMP/averon-admin-fixture.log"; exit 1; }
          admin_ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3200/login >/dev/null; then admin_ready=true; break; fi
            if ! kill -0 "$admin_pid" 2>/dev/null; then cat "$RUNNER_TEMP/averon-admin-vite.log"; exit 1; fi
            sleep 1
          done
          [[ "$admin_ready" == true ]] || { echo "Admin Vite server did not start"; cat "$RUNNER_TEMP/averon-admin-vite.log"; exit 1; }
          cd "$GITHUB_WORKSPACE"
          npm run e2e:smoke
        env:
          AVERON_STOREFRONT_URL: ${{ vars.AVERON_STOREFRONT_URL }}
          AVERON_ADMIN_URL: http://127.0.0.1:3200
          AVERON_FITTING_ROOM_FIXTURE_URL: http://127.0.0.1:4200
          AVERON_FITTING_ROOM_GLB: ${{ runner.temp }}/averon-e2e-fitting.glb
      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # actions/upload-artifact v6.0.0 (Node.js 24)
        with:
          name: averon-playwright-smoke
          path: reports/generated/playwright*
          if-no-files-found: warn
      - name: Generate release-verification manifest
        if: always()
        env:
          AVERON_MANIFEST_PATH: ${{ runner.temp }}/averon-release-manifest.json
          AVERON_VERIFICATION_STATUS: ${{ job.status }}
        run: node scripts/generate-verification-manifest.mjs
      - name: Publish SHA manifest and final status
        if: always()
        run: |
          {
            echo '## AVERON CROSS-REPOSITORY VERIFICATION'
            for pair in "AVERON-backend:backend" "AVERON-frontend:frontend" "AVERON-admin-panel:admin" "AVERON-parser:parser"; do
              name="${pair%%:*}"; path="${pair##*:}"
              sha="$(git -C "source-checkouts/$path" rev-parse HEAD 2>/dev/null || echo NOT_CHECKED_OUT)"
              echo "$name: $sha"
            done
            echo "Security tests: $(git rev-parse HEAD)"
            echo "Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified source SHA manifest
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # actions/upload-artifact v6.0.0 (Node.js 24)
        with:
          name: averon-source-sha-manifest
          path: ${{ runner.temp }}/averon-release-manifest.json
          if-no-files-found: warn

  product-id-database-integration:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.backend_ref != 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [repository-read-preflight]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: averon-integration-only
          POSTGRES_DB: averon_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d averon_integration"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:averon-integration-only@127.0.0.1:5432/averon_integration
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          repository: Saidaminov-x7/AVERON-backend
          ref: ${{ inputs.backend_ref }}
          path: source-checkouts/backend
          token: ${{ secrets.AVERON_REPOS_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node v6.5.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # pnpm/action-setup v4
        with:
          version: 9.15.9
      - name: Install backend and generate the isolated database client
        working-directory: source-checkouts/backend
        run: pnpm install --frozen-lockfile && pnpm prisma:generate
      - name: Create the pre-change Prisma schema, seed a legacy product, then apply the readable-ID migration
        working-directory: source-checkouts/backend
        shell: bash
        run: |
          set -euo pipefail
          migration_file='prisma/migrations/20261011120000_product_readable_public_id/migration.sql'
          test -f "$migration_file"
          sed '/^[[:space:]]*legacyPublicId[[:space:]]/d' prisma/schema.prisma > "$RUNNER_TEMP/commerce-before-public-id.prisma"
          pnpm exec prisma migrate diff \
            --from-empty \
            --to-schema-datamodel "$RUNNER_TEMP/commerce-before-public-id.prisma" \
            --script > "$RUNNER_TEMP/commerce-before-public-id.sql"
          pnpm exec prisma db execute --schema=prisma/schema.prisma --file="$RUNNER_TEMP/commerce-before-public-id.sql"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO \"CommerceProduct\" (\"id\", \"country\", \"slug\", \"publicId\", \"translations\", \"source\", \"sourceProductId\", \"salePriceUzs\", \"createdAt\", \"updatedAt\") VALUES ('codex-readable-id-fixture', 'CN', 'codex-readable-id-fixture', 'a42h-nbsq-o1fp-awaz', '{}', 'MANUAL', 'codex-readable-id-fixture', 1, NOW(), NOW())"
          pnpm exec prisma db execute --schema=prisma/schema.prisma --file="$migration_file"
      - name: Verify legacy lookup and sequential article allocation against PostgreSQL
        working-directory: source-checkouts/backend/apps/api
        run: node scripts/check-product-public-id-db.mjs

  publish-source-commit-status:
    if: ${{ always() && (github.event_name == 'repository_dispatch' && github.event.action == 'averon-application-changed' || github.event_name == 'workflow_dispatch' && inputs.backend_ref != 'main' && inputs.frontend_ref != 'main' && inputs.admin_ref != 'main' && inputs.parser_ref != 'main') }}
    runs-on: ubuntu-latest
    needs: [repository-read-preflight, regression-tests, product-id-database-integration]
    permissions: {}
    steps:
      - name: Publish required status to the exact source commit
        env:
          GH_TOKEN: ${{ secrets.AVERON_SOURCE_STATUS_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REPOSITORY: ${{ github.event.client_payload.repository }}
          SOURCE_SHA: ${{ github.event.client_payload.sha }}
          BACKEND_SHA: ${{ inputs.backend_ref }}
          FRONTEND_SHA: ${{ inputs.frontend_ref }}
          ADMIN_SHA: ${{ inputs.admin_ref }}
          PARSER_SHA: ${{ inputs.parser_ref }}
          PREFLIGHT_RESULT: ${{ needs.repository-read-preflight.result }}
          REGRESSION_RESULT: ${{ needs.regression-tests.result }}
          DATABASE_RESULT: ${{ needs.product-id-database-integration.result }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error title=Status credential missing::Configure AVERON_SOURCE_STATUS_TOKEN with Commit statuses: write on the four AVERON source repositories."
            exit 1
          fi
          if [[ "$PREFLIGHT_RESULT" == success && "$REGRESSION_RESULT" == success && ( "$DATABASE_RESULT" == success || "$DATABASE_RESULT" == skipped ) ]]; then
            state=success
            description="Exact-SHA cross-repository checks passed"
          else
            state=failure
            description="Cross-repository checks incomplete or failed; see linked run"
          fi
          publish_status() {
            repository="$1"; sha="$2"
            case "$repository" in
              AVERON-backend|AVERON-frontend|AVERON-admin-panel|AVERON-parser) ;;
              *) echo "::error::Unsupported source repository: $repository"; exit 1 ;;
            esac
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid SHA for $repository"; exit 1; }
            gh api "repos/Saidaminov-x7/$repository/statuses/$sha" \
              -f state="$state" \
              -f context='AVERON / cross-repository verify' \
              -f description="$description" \
              -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            publish_status AVERON-backend "$BACKEND_SHA"
            publish_status AVERON-frontend "$FRONTEND_SHA"
            publish_status AVERON-admin-panel "$ADMIN_SHA"
            publish_status AVERON-parser "$PARSER_SHA"
          else
            publish_status "$SOURCE_REPOSITORY" "$SOURCE_SHA"
          fi
