name: AVERON Security CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Exact backend commit SHA or main
        type: string
        required: true
        default: main
      frontend_ref:
        description: Exact frontend commit SHA or main
        type: string
        required: true
        default: main
      admin_ref:
        description: Exact admin commit SHA or main
        type: string
        required: true
        default: main
      parser_ref:
        description: Exact parser commit SHA or main
        type: string
        required: true
        default: main

permissions:
  contents: read

jobs:
  cross-repository-preflight:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require private source repository read access
        shell: bash
        env:
          AVERON_REPOS_READ_TOKEN: ${{ secrets.AVERON_REPOS_READ_TOKEN }}
        run: |
          if [[ -z "$AVERON_REPOS_READ_TOKEN" ]]; then
            message="Required cross-repository read credential is not configured. Required verification was NOT performed. Configure the AVERON_REPOS_READ_TOKEN Actions secret."
            echo "::error title=CI configuration incomplete::$message"
            printf '%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Cross-repository read credential is configured."

  policy:
    runs-on: ubuntu-latest
    needs: cross-repository-preflight
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          repository: Saidaminov-x7/AVERON-backend
          ref: ${{ inputs.backend_ref || 'main' }}
          path: source-checkouts/AVERON_backend
          token: ${{ secrets.AVERON_REPOS_READ_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node v6.5.0
        with:
          node-version: 22
      - name: Install security harness dependencies
        run: npm ci --ignore-scripts
      - name: Run security harness policy tests
        env:
          AVERON_BACKEND_REPO_PATH: ${{ github.workspace }}/source-checkouts/AVERON_backend
        run: |
          npm run security:tests
          npm run security:report
      - name: Upload normalized report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # actions/upload-artifact v6.0.0 (Node.js 24)
        with:
          name: averon-security-policy-report
          path: reports/generated/
          if-no-files-found: warn

  cross-repository-static:
    runs-on: ubuntu-latest
    needs: cross-repository-preflight
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          repository: Saidaminov-x7/AVERON-backend
          ref: ${{ inputs.backend_ref || 'main' }}
          path: source-checkouts/AVERON_backend
          token: ${{ secrets.AVERON_REPOS_READ_TOKEN }}
          fetch-depth: 0
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          repository: Saidaminov-x7/AVERON-frontend
          ref: ${{ inputs.frontend_ref || 'main' }}
          path: source-checkouts/AVERON_frontend
          token: ${{ secrets.AVERON_REPOS_READ_TOKEN }}
          fetch-depth: 0
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          repository: Saidaminov-x7/AVERON-admin-panel
          ref: ${{ inputs.admin_ref || 'main' }}
          path: source-checkouts/AVERON_admin_panel
          token: ${{ secrets.AVERON_REPOS_READ_TOKEN }}
          fetch-depth: 0
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          repository: Saidaminov-x7/AVERON-parser
          ref: ${{ inputs.parser_ref || 'main' }}
          path: source-checkouts/AVERON_parser
          token: ${{ secrets.AVERON_REPOS_READ_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node v6.5.0
        with:
          node-version: 22
      - name: Verify cross-repository checkout and Telegram source discovery
        env:
          AVERON_SOURCE_ROOT: source-checkouts
        run: |
          for repository in AVERON_backend AVERON_frontend AVERON_admin_panel AVERON_parser; do
            if [[ ! -f "source-checkouts/$repository/package.json" ]]; then
              echo "::error title=CHECKOUT_FAILURE::$repository checkout is missing under source-checkouts"
              exit 1
            fi
          done
          node --input-type=module -e '
            import path from "node:path";
            import { resolveAllRepositories } from "./scripts/repositories.mjs";
            import { discoverSourceFile } from "./scripts/source-discovery.mjs";
            const repositories = await resolveAllRepositories();
            const auth = await discoverSourceFile(repositories.AVERON_backend, {
              searchRoots: ["apps/api/src"],
              markers: ["timingSafeEqual", "auth_date", "createHmac"],
            });
            console.log(`Verified Telegram authentication source discovery: ${path.relative(repositories.AVERON_backend, auth)}`);
          '
      - name: Run cross-repository source regressions
        env:
          AVERON_SOURCE_ROOT: source-checkouts
        run: |
          npm run security:regression
          npm run security:migrations
      - name: Declare scanner scope
        if: always()
        run: node scripts/prepare-scan-scope.mjs
      - name: Set up Semgrep
        if: always()
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned Semgrep
        if: always()
        run: python -m pip install --disable-pip-version-check semgrep==1.179.0
      - name: Run Semgrep on application source
        id: semgrep
        if: always()
        run: node scripts/run-semgrep-ci.mjs
      - name: Run Trivy on AVERON-backend
        id: trivy_backend
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # aquasecurity/trivy-action v0.36.0
        with:
          scan-type: fs
          scan-ref: source-checkouts/AVERON_backend
          scanners: vuln,misconfig
          format: sarif
          output: reports/raw/AVERON_backend-trivy.sarif
          cache-dir: ${{ runner.temp }}/trivy-cache
          version: v0.75.0
          exit-code: "0"
      - name: Run Trivy on AVERON-frontend
        id: trivy_frontend
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # aquasecurity/trivy-action v0.36.0
        with:
          scan-type: fs
          scan-ref: source-checkouts/AVERON_frontend
          scanners: vuln,misconfig
          format: sarif
          output: reports/raw/AVERON_frontend-trivy.sarif
          cache-dir: ${{ runner.temp }}/trivy-cache
          version: v0.75.0
          exit-code: "0"
      - name: Run Trivy on AVERON-admin-panel
        id: trivy_admin
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # aquasecurity/trivy-action v0.36.0
        with:
          scan-type: fs
          scan-ref: source-checkouts/AVERON_admin_panel
          scanners: vuln,misconfig
          format: sarif
          output: reports/raw/AVERON_admin_panel-trivy.sarif
          cache-dir: ${{ runner.temp }}/trivy-cache
          version: v0.75.0
          exit-code: "0"
      - name: Run Trivy on AVERON-parser
        id: trivy_parser
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # aquasecurity/trivy-action v0.36.0
        with:
          scan-type: fs
          scan-ref: source-checkouts/AVERON_parser
          scanners: vuln,misconfig
          format: sarif
          output: reports/raw/AVERON_parser-trivy.sarif
          cache-dir: ${{ runner.temp }}/trivy-cache
          version: v0.75.0
          exit-code: "0"
      - name: Check GitHub Code Scanning availability
        id: code_scanning_availability
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response_file="${RUNNER_TEMP}/code-scanning-availability.json"
          status_code="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?per_page=1")" || {
              echo "::error title=Code Scanning availability check failed::GitHub API request failed; SARIF publication status is unknown."
              printf '%s\n' 'SARIF publication: EXECUTION_FAILED (GitHub API request failed; see step log).' >> "$GITHUB_STEP_SUMMARY"
              echo "status=EXECUTION_FAILED" >> "$GITHUB_OUTPUT"
              exit 1
            }

          message="$(jq -r 'if type == "object" then (.message // "") else "" end' "$response_file")"
          message_lower="${message,,}"
          if [[ "$status_code" == "200" ]]; then
            echo "status=AVAILABLE" >> "$GITHUB_OUTPUT"
            printf '%s\n' 'SARIF publication: AVAILABLE (uploads will run for generated reports).' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$status_code" == "404" ]]; then
            echo "status=BLOCKED_BY_GITHUB_FEATURE" >> "$GITHUB_OUTPUT"
            printf '%s\n' 'SARIF publication: BLOCKED_BY_GITHUB_FEATURE (Code Scanning alerts endpoint is not available; scanner results and baseline enforcement are unaffected).' >> "$GITHUB_STEP_SUMMARY"
            echo "Code Scanning alerts are unavailable for this repository; only SARIF publication will be skipped."
          elif [[ "$status_code" == "403" \
            && ( ( "$message_lower" == *"code scanning"* \
              && ( "$message_lower" == *"not enabled"* \
                || "$message_lower" == *"unavailable"* \
                || "$message_lower" == *"not available"* \
                || "$message_lower" == *"not configured"* ) ) \
              || ( "$message_lower" == *"advanced security"* \
                && ( "$message_lower" == *"must be enabled"* \
                  || "$message_lower" == *"not available"* ) ) ) ]]; then
            echo "status=BLOCKED_BY_GITHUB_FEATURE" >> "$GITHUB_OUTPUT"
            printf '%s\n' 'SARIF publication: BLOCKED_BY_GITHUB_FEATURE (Code Scanning is not enabled or available; scanner results and baseline enforcement are unaffected).' >> "$GITHUB_STEP_SUMMARY"
            echo "Code Scanning is unavailable for this repository; only SARIF publication will be skipped."
          else
            echo "status=EXECUTION_FAILED" >> "$GITHUB_OUTPUT"
            printf 'SARIF publication: EXECUTION_FAILED (unexpected GitHub API response; HTTP %s).\n' "$status_code" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Code Scanning availability check failed::Unexpected GitHub API response (HTTP ${status_code}); SARIF publication status is unknown."
            exit 1
          fi
      - name: Upload backend Trivy SARIF
        if: always() && steps.code_scanning_availability.outputs.status == 'AVAILABLE' && hashFiles('reports/raw/AVERON_backend-trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # github/codeql-action v4
        with:
          sarif_file: reports/raw/AVERON_backend-trivy.sarif
      - name: Upload frontend Trivy SARIF
        if: always() && steps.code_scanning_availability.outputs.status == 'AVAILABLE' && hashFiles('reports/raw/AVERON_frontend-trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # github/codeql-action v4
        with:
          sarif_file: reports/raw/AVERON_frontend-trivy.sarif
      - name: Upload Admin Trivy SARIF
        if: always() && steps.code_scanning_availability.outputs.status == 'AVAILABLE' && hashFiles('reports/raw/AVERON_admin_panel-trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # github/codeql-action v4
        with:
          sarif_file: reports/raw/AVERON_admin_panel-trivy.sarif
      - name: Upload Parser Trivy SARIF
        if: always() && steps.code_scanning_availability.outputs.status == 'AVAILABLE' && hashFiles('reports/raw/AVERON_parser-trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # github/codeql-action v4
        with:
          sarif_file: reports/raw/AVERON_parser-trivy.sarif
      - name: Install pinned Gitleaks
        id: install_gitleaks
        if: always()
        shell: bash
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          install_dir="${RUNNER_TEMP}/gitleaks-${GITLEAKS_VERSION}"
          mkdir -p "$install_dir"
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "$archive_path"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive_path" | sha256sum --check
          tar -xzf "$archive_path" -C "$install_dir" gitleaks
          chmod 0755 "$install_dir/gitleaks"
          "$install_dir/gitleaks" version
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Scan repository histories with redaction
        id: gitleaks
        if: always()
        run: node scripts/run-gitleaks-ci.mjs
      - name: Record scanner execution and report coverage
        if: always()
        env:
          SEMGREP_VERSION: "1.142.0"
          TRIVY_VERSION: "0.75.0"
          GITLEAKS_VERSION: "8.28.0"
          TRIVY_BACKEND_OUTCOME: ${{ steps.trivy_backend.outcome }}
          TRIVY_FRONTEND_OUTCOME: ${{ steps.trivy_frontend.outcome }}
          TRIVY_ADMIN_OUTCOME: ${{ steps.trivy_admin.outcome }}
          TRIVY_PARSER_OUTCOME: ${{ steps.trivy_parser.outcome }}
        run: node scripts/write-scan-manifest.mjs
      - name: Generate normalized security report
        if: always()
        env:
          SARIF_PUBLICATION_STATUS: ${{ steps.code_scanning_availability.outputs.status || 'EXECUTION_FAILED' }}
        run: node scripts/generate-report.mjs
      - name: Enforce security baseline
        if: always()
        run: node scripts/enforce-baseline.mjs
      - name: Upload redacted scanner reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # actions/upload-artifact v6.0.0 (Node.js 24)
        with:
          name: averon-static-security-reports
          path: |
            reports/generated/
            reports/raw/*-trivy.sarif
          if-no-files-found: warn
