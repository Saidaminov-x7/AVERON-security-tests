name: AVERON Security CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Run security harness policy tests
        run: |
          npm run security:tests
          npm run security:report
      - name: Upload normalized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: averon-security-policy-report
          path: reports/generated/
          if-no-files-found: warn

  cross-repository-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: Saidaminov-x7/AVERON-backend
          ref: main
          path: source-checkouts/AVERON_backend
          token: ${{ secrets.AVERON_SOURCE_READ_TOKEN }}
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: Saidaminov-x7/AVERON-frontend
          ref: main
          path: source-checkouts/AVERON_frontend
          token: ${{ secrets.AVERON_SOURCE_READ_TOKEN }}
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: Saidaminov-x7/AVERON-admin-panel
          ref: main
          path: source-checkouts/AVERON_admin_panel
          token: ${{ secrets.AVERON_SOURCE_READ_TOKEN }}
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: Saidaminov-x7/AVERON-parser
          ref: main
          path: source-checkouts/AVERON_parser
          token: ${{ secrets.AVERON_SOURCE_READ_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Run cross-repository source regressions
        env:
          AVERON_SOURCE_ROOT: source-checkouts
        run: |
          npm run security:regression
          npm run security:migrations
      - name: Declare scanner scope
        if: always()
        run: |
          mkdir -p reports/raw reports/generated
          cat > reports/raw/scan-scope.json <<'JSON'
          {
            "scans": {
              "Semgrep": ["AVERON_backend", "AVERON_frontend", "AVERON_admin_panel", "AVERON_parser"],
              "Trivy": ["AVERON_backend", "AVERON_frontend", "AVERON_admin_panel", "AVERON_parser"],
              "Gitleaks current files": ["AVERON_backend", "AVERON_frontend", "AVERON_admin_panel", "AVERON_parser", "AVERON_security_tests"],
              "Gitleaks Git history": ["AVERON_backend", "AVERON_frontend", "AVERON_admin_panel", "AVERON_parser", "AVERON_security_tests"]
            }
          }
          JSON
      - name: Set up Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.142.0
      - name: Run Semgrep on application source
        id: semgrep
        run: |
          for repository in AVERON_backend AVERON_frontend AVERON_admin_panel AVERON_parser; do
            semgrep scan --config p/security-audit \
              --config security-tools/semgrep/averon.yml --json \
              --output "reports/raw/${repository}-semgrep.json" "source-checkouts/${repository}"
          done
      - name: Run Trivy filesystem scan
        id: trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: source-checkouts
          scanners: vuln,misconfig
          format: sarif
          output: reports/raw/averon-trivy.sarif
          version: v0.75.0
          exit-code: "0"
      - name: Upload Trivy SARIF
        if: always() && hashFiles('reports/raw/averon-trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/raw/averon-trivy.sarif
        continue-on-error: true
      - name: Set up Gitleaks
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.0"
      - name: Install pinned Gitleaks
        run: go install github.com/gitleaks/gitleaks/v8@v8.28.0
      - name: Scan repository histories with redaction
        id: gitleaks
        run: |
          mkdir -p reports/raw
          scan_status=0
          for dir in . source-checkouts/*; do
            git -C "$dir" rev-parse --is-inside-work-tree >/dev/null 2>&1 || continue
            name="$(basename "$dir")"
            if ! (cd "$dir" && "$(go env GOPATH)/bin/gitleaks" dir --no-banner --redact \
              --report-format json --report-path "$GITHUB_WORKSPACE/reports/raw/${name}-gitleaks-current.json" \
              --exit-code 0 .); then
              scan_status=1
            fi
            if ! (cd "$dir" && "$(go env GOPATH)/bin/gitleaks" git --no-banner --redact \
              --report-format json --report-path "$GITHUB_WORKSPACE/reports/raw/${name}-gitleaks-history.json" \
              --exit-code 0 .); then
              scan_status=1
            fi
          done
          exit "$scan_status"
      - name: Record scanner execution and report coverage
        if: always()
        env:
          SEMGREP_OUTCOME: ${{ steps.semgrep.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
        run: node scripts/write-scan-manifest.mjs
      - name: Generate normalized security report
        if: always()
        run: node scripts/generate-report.mjs
      - name: Enforce security baseline
        if: always()
        run: node scripts/enforce-baseline.mjs
      - name: Upload redacted scanner reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: averon-static-security-reports
          path: |
            reports/generated/
            reports/raw/averon-trivy.sarif
          if-no-files-found: warn
