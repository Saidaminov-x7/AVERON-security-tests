name: AVERON Security CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-repository-preflight:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require private source repository read access
        shell: bash
        env:
          AVERON_REPOS_READ_TOKEN: ${{ secrets.AVERON_REPOS_READ_TOKEN }}
        run: |
          if [[ -z "$AVERON_REPOS_READ_TOKEN" ]]; then
            message="Required cross-repository read credential is not configured. Required verification was NOT performed. Configure the AVERON_REPOS_READ_TOKEN Actions secret."
            echo "::error title=CI configuration incomplete::$message"
            printf '%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Cross-repository read credential is configured."

  policy:
    runs-on: ubuntu-latest
    needs: cross-repository-preflight
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          repository: Saidaminov-x7/AVERON-backend
          ref: main
          path: source-checkouts/AVERON_backend
          token: ${{ secrets.AVERON_REPOS_READ_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node v6.5.0
        with:
          node-version: 24
      - name: Run security harness policy tests
        env:
          AVERON_BACKEND_REPO_PATH: ${{ github.workspace }}/source-checkouts/AVERON_backend
        run: |
          npm run security:tests
          npm run security:report
      - name: Upload normalized report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4.6.2
        with:
          name: averon-security-policy-report
          path: reports/generated/
          if-no-files-found: warn

  cross-repository-static:
    runs-on: ubuntu-latest
    needs: cross-repository-preflight
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          repository: Saidaminov-x7/AVERON-backend
          ref: main
          path: source-checkouts/AVERON_backend
          token: ${{ secrets.AVERON_REPOS_READ_TOKEN }}
          fetch-depth: 0
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          repository: Saidaminov-x7/AVERON-frontend
          ref: main
          path: source-checkouts/AVERON_frontend
          token: ${{ secrets.AVERON_REPOS_READ_TOKEN }}
          fetch-depth: 0
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          repository: Saidaminov-x7/AVERON-admin-panel
          ref: main
          path: source-checkouts/AVERON_admin_panel
          token: ${{ secrets.AVERON_REPOS_READ_TOKEN }}
          fetch-depth: 0
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          repository: Saidaminov-x7/AVERON-parser
          ref: main
          path: source-checkouts/AVERON_parser
          token: ${{ secrets.AVERON_REPOS_READ_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node v6.5.0
        with:
          node-version: 24
      - name: Run cross-repository source regressions
        env:
          AVERON_SOURCE_ROOT: source-checkouts
        run: |
          npm run security:regression
          npm run security:migrations
      - name: Declare scanner scope
        if: always()
        run: node scripts/prepare-scan-scope.mjs
      - name: Set up Semgrep
        if: always()
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python v6
        with:
          python-version: "3.12"
      - name: Install pinned Semgrep
        if: always()
        run: python -m pip install --disable-pip-version-check semgrep==1.142.0
      - name: Run Semgrep on application source
        id: semgrep
        if: always()
        run: node scripts/run-semgrep-ci.mjs
      - name: Run Trivy on AVERON-backend
        id: trivy_backend
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # aquasecurity/trivy-action v0.36.0
        with:
          scan-type: fs
          scan-ref: source-checkouts/AVERON_backend
          scanners: vuln,misconfig
          format: sarif
          output: reports/raw/AVERON_backend-trivy.sarif
          version: v0.75.0
          exit-code: "0"
      - name: Run Trivy on AVERON-frontend
        id: trivy_frontend
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # aquasecurity/trivy-action v0.36.0
        with:
          scan-type: fs
          scan-ref: source-checkouts/AVERON_frontend
          scanners: vuln,misconfig
          format: sarif
          output: reports/raw/AVERON_frontend-trivy.sarif
          version: v0.75.0
          exit-code: "0"
      - name: Run Trivy on AVERON-admin-panel
        id: trivy_admin
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # aquasecurity/trivy-action v0.36.0
        with:
          scan-type: fs
          scan-ref: source-checkouts/AVERON_admin_panel
          scanners: vuln,misconfig
          format: sarif
          output: reports/raw/AVERON_admin_panel-trivy.sarif
          version: v0.75.0
          exit-code: "0"
      - name: Run Trivy on AVERON-parser
        id: trivy_parser
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # aquasecurity/trivy-action v0.36.0
        with:
          scan-type: fs
          scan-ref: source-checkouts/AVERON_parser
          scanners: vuln,misconfig
          format: sarif
          output: reports/raw/AVERON_parser-trivy.sarif
          version: v0.75.0
          exit-code: "0"
      - name: Upload backend Trivy SARIF
        if: always() && hashFiles('reports/raw/AVERON_backend-trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # github/codeql-action v4
        with:
          sarif_file: reports/raw/AVERON_backend-trivy.sarif
      - name: Upload frontend Trivy SARIF
        if: always() && hashFiles('reports/raw/AVERON_frontend-trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # github/codeql-action v4
        with:
          sarif_file: reports/raw/AVERON_frontend-trivy.sarif
      - name: Upload Admin Trivy SARIF
        if: always() && hashFiles('reports/raw/AVERON_admin_panel-trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # github/codeql-action v4
        with:
          sarif_file: reports/raw/AVERON_admin_panel-trivy.sarif
      - name: Upload Parser Trivy SARIF
        if: always() && hashFiles('reports/raw/AVERON_parser-trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # github/codeql-action v4
        with:
          sarif_file: reports/raw/AVERON_parser-trivy.sarif
      - name: Set up Gitleaks
        if: always()
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # actions/setup-go v6.5.0
        with:
          go-version: "1.25.0"
      - name: Install pinned Gitleaks
        if: always()
        run: go install github.com/gitleaks/gitleaks/v8@v8.28.0
      - name: Scan repository histories with redaction
        id: gitleaks
        if: always()
        run: node scripts/run-gitleaks-ci.mjs
      - name: Record scanner execution and report coverage
        if: always()
        env:
          TRIVY_BACKEND_OUTCOME: ${{ steps.trivy_backend.outcome }}
          TRIVY_FRONTEND_OUTCOME: ${{ steps.trivy_frontend.outcome }}
          TRIVY_ADMIN_OUTCOME: ${{ steps.trivy_admin.outcome }}
          TRIVY_PARSER_OUTCOME: ${{ steps.trivy_parser.outcome }}
        run: node scripts/write-scan-manifest.mjs
      - name: Generate normalized security report
        if: always()
        run: node scripts/generate-report.mjs
      - name: Enforce security baseline
        if: always()
        run: node scripts/enforce-baseline.mjs
      - name: Upload redacted scanner reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4.6.2
        with:
          name: averon-static-security-reports
          path: |
            reports/generated/
            reports/raw/*-trivy.sarif
          if-no-files-found: warn
