name: AVERON Production Safe Checks

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to check
        required: true
        type: choice
        options:
          - backend
          - frontend
          - admin
          - parser

permissions:
  contents: read

jobs:
  safe-checks:
    runs-on: ubuntu-latest
    environment: production-safe
    env:
      SECURITY_ENV: production-safe
      SECURITY_SERVICE: ${{ inputs.service }}
      SECURITY_TARGET_URL: ${{ vars.SECURITY_PRODUCTION_SAFE_TARGET_URL }}
      SECURITY_PRODUCTION_SAFE_ALLOWED_ORIGINS: ${{ vars.SECURITY_PRODUCTION_SAFE_ALLOWED_ORIGINS }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node v6.5.0
        with:
          node-version: 22
      - name: Run fixed non-destructive checks only
        run: npm run security:safe
      - name: Upload masked report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # actions/upload-artifact v6.0.0 (Node.js 24)
        with:
          name: averon-production-safe-${{ inputs.service }}
          path: reports/generated/safe-checks.json
          if-no-files-found: warn
